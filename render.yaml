# Render blueprint for the public demo backend (Django + PostGIS, demo mode).
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo. Then fill the
# sync:false secrets (Aiven DB creds, Gemini key, frontend origins) in the UI.
services:
  - type: web
    name: stillthere-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DEMO_MODE
        value: "1"
      - key: DB_SSLMODE
        value: require
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # --- Fill these in the Render dashboard (Environment tab) ---
      - key: DJANGO_ALLOWED_HOSTS        # e.g. stillthere-backend.onrender.com
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS # e.g. https://stillthere-backend.onrender.com,https://your-site.netlify.app
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS # e.g. https://your-site.netlify.app
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: GEMINI_API_KEY             # from https://aistudio.google.com/apikey
        sync: false
